services:
  youtube:
    build:
      context: .
    image: youtube
    expose:
      - "3000"
    networks:
      - web_network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  web_network:
    external: true
    name: web_network
